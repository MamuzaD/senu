# senu: add these lines to your tmux.conf, then reload it.
# Paths assume install.sh's default ~/.local/bin, since run-shell may not have
# it on PATH. Change them if you set SENU_INSTALL_DIR.

# Watch agent panes and set each window's @ai_state. Safe on every reload: a
# second start on the same server exits.
run-shell -b "~/.local/bin/senu watch"
# Refresh herdr's detection manifests, at most once a day.
run-shell -b "~/.local/bin/senu scout manifest refresh --daily"

# A glyph per state: working ●, blocked !, done ● (finished, not yet seen),
# idle ◯. Windows without an agent show nothing.
set -g @senu_status "#{?@ai_state, #{?#{==:#{@ai_state},working},#[fg=yellow]●,#{?#{==:#{@ai_state},blocked},#[fg=red bold]!,#{?#{==:#{@ai_state},done},#[fg=blue bold]●,#[fg=green]◯}}}#[default],}"
# tmux's default window formats plus the glyph. If you already set these, or a
# theme does, add #{E:@senu_status} to those formats instead.
set -g window-status-format "#I:#W#{window_flags}#{E:@senu_status}"
set -g window-status-current-format "#I:#W#{window_flags}#{E:@senu_status}"

# prefix a: pick an agent and jump to it. prefix u: usage limits and cost.
# Stock tmux leaves a and u free; rebind if yours don't.
bind a display-popup -E -w 50% -h 60% "~/.local/bin/senu agents"
bind u display-popup -E -w 50% -h 70% "~/.local/bin/senu vision"

# Optional: prefix S toggles the chimes.
# bind S run-shell -b "~/.local/bin/senu sound toggle"
