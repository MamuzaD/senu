name: Setup
description: Install Bun at the version pinned in package.json, then the locked dependencies.
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      env:
        # CI never commits, so skip installing the git hooks.
        HUSKY: "0"
