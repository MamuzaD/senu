# ~/.config/senu/config.toml

# The usage popup's scene: "night" (the default), "dawn", "day", "dusk", or
# "auto" to follow local time when the popup opens (dawn 05:30–07:00, day
# 07:00–17:30, dusk 17:30–19:30, night otherwise). SENU_SCENE overrides it.
[usage]
scene = "night"

# Usage popup profiles, shown in this order. `home` is CODEX_HOME for Codex
# and the Claude config dir for Claude. Without any profiles senu shows
# Codex at $CODEX_HOME (or ~/.codex) and Claude at ~/.claude.

[[usage.profiles]]
kind = "codex"
name = "personal"
home = "~/.codex"

[[usage.profiles]]
kind = "codex"
name = "work"
home = "~/.codex-work"

[[usage.profiles]]
kind = "claude"
name = "work"
home = "~/.claude"

# The agent picker (senu agents). On macOS, when the agent you jump to is in
# a session already showing in another Ghostty tab, senu raises that tab
# (through Ghostty's AppleScript dictionary; macOS asks once for Automation
# permission) instead of pulling the session into the tab you're in. Set it
# to false to always switch the current tab's client. It does nothing outside
# Ghostty on macOS.
[agents]
raise_ghostty_tab = true
